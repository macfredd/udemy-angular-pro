<p class="text-3xl">Contact Us</p>
<hr class="my-2">

<section>
    <p class="text-xl">We'd love to hear from you!</p>
    <p class="text-lg">Complete the form below to send us a message.</p>

    <form class="mt-4">
        <div class="mb-4">
          <label for="name" class="block text">Name</label>
          <input type="text" id="name" name="name" class="w-full border border-gray-300 rounded p-2">
        </div>
        <div class="mb-4">
          <label for="email" class="block text">Email</label>
          <input type="email" id="email" name="email" class="w-full border border-gray-300 rounded p-2">
        </div>
        <div class="mb-4">
          <label for="message" class="block text">Message</label>
          <textarea id="message" name="message" class="w-full border border-gray-300 rounded p-2"></textarea>
        </div>
        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded">
        Send Message
        </button>
      </form>
</section>
